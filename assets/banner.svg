<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#101428" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="35%" stop-color="#FFE66D" />
      <stop offset="70%" stop-color="#4ECDC4" />
      <stop offset="100%" stop-color="#1A535C" />
    </linearGradient>

    <linearGradient id="beamGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#fecfef" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#a1c4fd" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beamGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#66a6ff" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdd59" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#ff5e57" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e272e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2d3" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#01a3a4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00d2d3" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- SVG Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <style>
      @keyframes pulseLight {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(3deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-3deg); }
      }
      @keyframes raySweep {
        0%, 100% { opacity: 0.25; transform: rotate(0deg); }
        50% { opacity: 0.55; transform: rotate(6deg); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -100; }
      }
      .pulse-orb {
        animation: pulseLight 6s ease-in-out infinite;
        transform-origin: center;
      }
      .float-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .float-card-2 {
        animation: floatReverse 8s ease-in-out infinite;
        transform-origin: center;
      }
      .light-ray-1 {
        animation: raySweep 9s ease-in-out infinite;
        transform-origin: 150px 50px;
      }
      .light-ray-2 {
        animation: raySweep 11s ease-in-out infinite alternate;
        transform-origin: 1050px 60px;
      }
      .data-stream {
        stroke-dasharray: 6, 6;
        animation: dashFlow 20s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC BACKGROUND LIGHTING ELEMENTS -->
  <!-- Ambient Spotlights / Caustic Cones -->
  <g class="light-ray-1">
    <polygon points="150,20 0,420 480,420" fill="url(#beamGrad1)" />
  </g>
  <g class="light-ray-2">
    <polygon points="1050,30 720,420 1200,420" fill="url(#beamGrad2)" />
  </g>

  <!-- Glowing Light Orbs -->
  <circle cx="160" cy="80" r="130" fill="url(#sunGlow)" class="pulse-orb" filter="url(#glow)" />
  <circle cx="1060" cy="110" r="140" fill="url(#cyanOrb)" class="pulse-orb" filter="url(#glow)" style="animation-delay: -3s;" />
  <circle cx="600" cy="380" r="180" fill="url(#beamGrad1)" class="pulse-orb" style="animation-delay: -1.5s;" />

  <!-- Dynamic Ray-Tracing Light Paths (Curved Splines with flow) -->
  <path d="M 80 340 Q 240 180 400 320 T 780 260 T 1140 310" fill="none" stroke="#ffdd59" stroke-width="2" stroke-opacity="0.4" class="data-stream" />
  <path d="M 60 120 Q 320 260 620 140 T 1120 200" fill="none" stroke="#4ecdc4" stroke-width="2" stroke-opacity="0.35" class="data-stream" style="animation-duration: 25s;" />

  <!-- Decorative Floating Background Cards (Positioned away from center title) -->
  <!-- Left Side: 3DGS & Inverse Rendering Card -->
  <g class="float-card-1" transform="translate(60, 240)">
    <rect width="190" height="90" rx="12" fill="url(#cardGrad)" stroke="#ff6b6b" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="28" cy="30" r="12" fill="#ff6b6b" fill-opacity="0.2" />
    <text x="28" y="35" font-size="14" text-anchor="middle" fill="#ff6b6b">💡</text>
    <text x="50" y="34" fill="#ffffff" class="badge-text" font-size="13">3DGS Relighting</text>
    <text x="20" y="65" fill="#a0aec0" class="badge-text" font-size="11">BRDF Decomposition</text>
    <text x="20" y="78" fill="#718096" class="badge-text" font-size="10">Ray-traced Specular</text>
  </g>

  <!-- Right Side: HDRI & Path Tracing Card -->
  <g class="float-card-2" transform="translate(950, 240)">
    <rect width="190" height="90" rx="12" fill="url(#cardGrad)" stroke="#4ecdc4" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="28" cy="30" r="12" fill="#4ecdc4" fill-opacity="0.2" />
    <text x="28" y="35" font-size="14" text-anchor="middle" fill="#4ecdc4">✨</text>
    <text x="50" y="34" fill="#ffffff" class="badge-text" font-size="13">Spectral Path Tracing</text>
    <text x="20" y="65" fill="#a0aec0" class="badge-text" font-size="11">32-Bit EXR / IBL Dome</text>
    <text x="20" y="78" fill="#718096" class="badge-text" font-size="10">Real-Time Lightformers</text>
  </g>

  <!-- FOREGROUND: TITLE & SUBTITLE HERO SECTION -->
  <!-- Main Category Pill -->
  <g transform="translate(600, 68)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1" />
    <circle cx="-150" cy="0" r="6" fill="#4ECDC4" filter="url(#subtleGlow)" />
    <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" class="badge-text" letter-spacing="1">
      ⚡ NEXT-GEN COMPUTER GRAPHICS &amp; VFX
    </text>
  </g>

  <!-- Master Title -->
  <text x="600" y="150" text-anchor="middle" class="title-text" font-size="46" fill="url(#titleGrad)" filter="url(#subtleGlow)">
    Awesome 3D Lighting &amp; Relighting
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
    Physically Based Rendering • 3D Gaussian Splatting • Neural Inverse Transport • HDRI Studio IBL
  </text>

  <!-- Feature Pills in Center Foreground -->
  <g transform="translate(600, 245)">
    <!-- Pill 1 -->
    <g transform="translate(-250, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#ff6b6b" fill-opacity="0.12" stroke="#ff6b6b" stroke-opacity="0.4" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#ffa8a8" class="badge-text">☀️ Neural Relighting</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-80, 0)">
      <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#ffd166" fill-opacity="0.12" stroke="#ffd166" stroke-opacity="0.4" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#ffe082" class="badge-text">🔮 Gaussian Splats</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(90, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#06d6a0" fill-opacity="0.12" stroke="#06d6a0" stroke-opacity="0.4" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#a7f3d0" class="badge-text">🌐 HDRI Lightmaps</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(250, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#118ab2" fill-opacity="0.15" stroke="#118ab2" stroke-opacity="0.4" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#93c5fd" class="badge-text">🚀 Cloud Path Tracing</text>
    </g>
  </g>

  <!-- Bottom Ecosystem Bar -->
  <line x1="280" y1="360" x2="920" y2="360" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
  <text x="600" y="388" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    Curated for VFX Artists • Lighting TDs • Graphics Researchers • Vision Engineers
  </text>

  <!-- Decorative Corner Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#FF6B6B" stroke-width="2" stroke-opacity="0.4" />
  <path d="M 1150 20 L 1180 20 L 1180 50" fill="none" stroke="#4ECDC4" stroke-width="2" stroke-opacity="0.4" />
  <path d="M 20 370 L 20 400 L 50 400" fill="none" stroke="#4ECDC4" stroke-width="2" stroke-opacity="0.4" />
  <path d="M 1150 400 L 1180 400 L 1180 370" fill="none" stroke="#FF6B6B" stroke-width="2" stroke-opacity="0.4" />
</svg>
